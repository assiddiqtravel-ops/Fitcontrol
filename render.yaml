# Render Blueprint for FitControl.
# Deploy: push this repo, then in Render → "New +" → "Blueprint" → pick this repo.
# Render provisions a managed PostgreSQL, the FastAPI web service, and two
# background workers (bot + notification scheduler). Secrets marked sync:false
# must be filled in the Render dashboard (never commit them).
#
# The frontend (Mini App) is NOT deployed here — it goes to Vercel (see
# docs/DEPLOYMENT.md).

databases:
  - name: fitcontrol-db
    databaseName: fitcontrol
    plan: free # upgrade to a paid plan for production durability & backups
    # Render manages persistence; data does NOT live in a service's local disk.

services:
  # ---------------------------------------------------------------- API (web)
  - type: web
    name: fitcontrol-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # Run migrations, then start uvicorn (entrypoint handles this).
    dockerCommand: ./entrypoint.sh api
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitcontrol-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL # your Vercel Mini App URL, e.g. https://fitcontrol.vercel.app
        sync: false
      - key: CORS_ORIGINS # set to the Vercel origin, e.g. https://fitcontrol.vercel.app
        sync: false
      - key: DEV_AUTH_MODE
        value: "false"
      - key: DEFAULT_TIMEZONE
        value: Asia/Tashkent
      - key: TELEGRAM_UPDATE_MODE
        value: polling # primary method: a background worker polls (see below)
      # If you switch to webhook mode, set these and use the api service URL:
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_API_URL
        sync: false

  # ------------------------------------------------------------- Bot (worker)
  # Primary Telegram update method: long polling in a Background Worker, so it
  # never depends on an open browser and runs independently of the web dyno.
  - type: worker
    name: fitcontrol-bot
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: ./entrypoint.sh bot
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitcontrol-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false

  # ------------------------------------------------- Scheduler (worker)
  # Notifications & daily summaries run here — independent of any browser.
  - type: worker
    name: fitcontrol-scheduler
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: ./entrypoint.sh scheduler
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitcontrol-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Tashkent
      - key: DAILY_SUMMARY_HOUR
        value: "9"
      - key: EXPIRY_REMINDER_DAYS
        value: "3"
