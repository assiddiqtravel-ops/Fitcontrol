[project]
name = "fitcontrol-backend"
version = "0.1.0"
description = "FitControl — SaaS automation for fitness clubs (backend, bot, API)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
